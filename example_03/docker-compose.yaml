version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: leads_db
      MYSQL_USER: user
      MYSQL_PASSWORD: pass
    ports:
      - "3306:3306"
    volumes:
      - ./infra/db/mysql:/var/lib/mysql
      - ./infra/mysql/mysql-init:/docker-entrypoint-initdb.d

  postgres:
    image: postgres:15
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: leads_db
    ports:
      - "5432:5432"
    volumes:
      - ./infra/db/postgres:/var/lib/postgresql/data
      - ./infra/postgres/pg-init:/docker-entrypoint-initdb.d

  redis:
    image: redis:7
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - ./infra/db/redis:/data
      - ./infra/redis/init.sh:/docker-entrypoint-initdb.d/init.sh
    command: ["sh", "/docker-entrypoint-initdb.d/init.sh"]
